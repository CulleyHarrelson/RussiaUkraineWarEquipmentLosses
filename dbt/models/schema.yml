version: 2

models:
  - name: cumulative_losses
    description: >
      This model tracks cumulative losses of equipment by country, category, and date.
      It's useful for analyzing trends in equipment losses over time.
    columns:
      - name: date_recorded
        description: "The date when the loss was recorded"
        data_tests:
          - not_null
      - name: country
        description: "The country where the loss occurred"
        data_tests:
          - not_null
          - accepted_values:
              values: ["Russia", "Ukraine"] # Example list of countries
      - name: predicted_category
        description: "The category of the lost equipment"
        data_tests:
          - not_null
          - relationships:
              to: ref('distinct_categories')
              field: predicted_category
      - name: daily_loss_count
        description: "The number of equipment losses on this specific date"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: cumulative_loss_count
        description: "The total number of equipment losses up to and including this date"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - date_recorded
            - country
            - predicted_category
  - name: distinct_categories
    description: "Distinct categories of equipment from the equipment analysis"
    columns:
      - name: predicted_category
        description: "Unique categories of equipment"
        data_tests:
          - not_null
          - unique
